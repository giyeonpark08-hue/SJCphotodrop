<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submit a Photo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- GREEN TOP SECTION -->

    <section class="hero">

        <div class="hero-content">

            <p class="school-name">
                St. John’s College · Student Council
            </p>

            <h1>
                Submit Your Photos
            </h1>

            <p class="subtitle">
                Share your favourite school memories with Student Council.
            </p>

        </div>

    </section>


    <!-- WHITE CONTENT SECTION -->

    <main class="content">

        <div class="form-container">


            <!-- CATEGORY -->

            <div class="field">

                <span class="field-title">
                    CATEGORY
                </span>


                <!-- Pep Rally -->

                <label class="option">

                    <input
                        type="radio"
                        name="category"
                        id="pepRally"
                        value="Pep Rally"
                    >

                    <span>
                        Pep Rally
                    </span>

                </label>


                <div
                    id="pepRallyDetails"
                    class="sub-field"
                >

                    <select id="pepRallyType">

                        <option value="">
                            Select which Pep Rally
                        </option>

                        <option value="Fall Pep Rally">
                            Fall Pep Rally
                        </option>

                        <option value="Winter Pep Rally">
                            Winter Pep Rally
                        </option>

                        <option value="Spring Pep Rally">
                            Spring Pep Rally
                        </option>

                    </select>

                </div>


                <!-- Dance -->

                <label class="option">

                    <input
                        type="radio"
                        name="category"
                        id="dance"
                        value="Dance"
                    >

                    <span>
                        Dance
                    </span>

                </label>


                <div
                    id="danceDetails"
                    class="sub-field"
                >

                    <select id="danceType">

                        <option value="">
                            Select which Dance
                        </option>

                        <option value="Colour Night">
                            Colour Night
                        </option>

                        <option value="Fall Dance">
                            Fall Dance
                        </option>

                        <option value="Semi-Formal">
                            Semi-Formal
                        </option>

                        <option value="Spring Dance">
                            Spring Dance
                        </option>

                        <option value="Prom">
                            Prom
                        </option>

                    </select>

                </div>


                <!-- Coffee House -->

                <label class="option">

                    <input
                        type="radio"
                        name="category"
                        id="coffeeHouse"
                        value="Coffee House"
                    >

                    <span>
                        Coffee House
                    </span>

                </label>


                <div
                    id="coffeeHouseDetails"
                    class="sub-field"
                >

                    <select id="coffeeHouseType">

                        <option value="">
                            Select which Coffee House
                        </option>

                        <option value="Christmas Coffee House">
                            Christmas Coffee House
                        </option>

                        <option value="Spring Coffee House">
                            Spring Coffee House
                        </option>

                    </select>

                </div>


                <!-- Sports -->

                <label class="option">

                    <input
                        type="radio"
                        name="category"
                        id="sports"
                        value="Sports"
                    >

                    <span>
                        Sports
                    </span>

                </label>


                <!-- SPORTS DETAILS -->

                <div
                    id="sportsDetails"
                    class="sub-field"
                >

                    <span class="field-title">
                        SEASON
                    </span>


                    <!-- Fall -->

                    <label class="option">

                        <input
                            type="radio"
                            name="sportsSeason"
                            id="fallSports"
                            value="Fall"
                        >

                        <span>
                            Fall
                        </span>

                    </label>


                    <!-- Winter -->

                    <label class="option">

                        <input
                            type="radio"
                            name="sportsSeason"
                            id="winterSports"
                            value="Winter"
                        >

                        <span>
                            Winter
                        </span>

                    </label>


                    <!-- Spring -->

                    <label class="option">

                        <input
                            type="radio"
                            name="sportsSeason"
                            id="springSports"
                            value="Spring"
                        >

                        <span>
                            Spring
                        </span>

                    </label>


                    <!-- Other -->

                    <label class="option">

                        <input
                            type="radio"
                            name="sportsSeason"
                            id="otherSeasonSports"
                            value="Other"
                        >

                        <span>
                            Other
                        </span>

                    </label>


                    <!-- LEVEL -->

                    <div
                        id="sportDivisionDetails"
                        class="sub-field"
                    >

                        <span class="field-title">
                            LEVEL
                        </span>


                        <!-- Junior -->

                        <label class="option">

                            <input
                                type="radio"
                                name="sportsDivision"
                                id="juniorSports"
                                value="Junior"
                            >

                            <span>
                                Junior
                            </span>

                        </label>


                        <!-- Senior -->

                        <label class="option">

                            <input
                                type="radio"
                                name="sportsDivision"
                                id="seniorSports"
                                value="Senior"
                            >

                            <span>
                                Senior
                            </span>

                        </label>


                        <!-- Other -->

                        <label class="option">

                            <input
                                type="radio"
                                name="sportsDivision"
                                id="otherSports"
                                value="Other"
                            >

                            <span>
                                Other
                            </span>

                        </label>


                        <!-- SPORT -->

                        <div
                            id="sportTypeDetails"
                            class="sub-field"
                        >

                            <select id="sportType">

                                <option value="">
                                    Select which sport
                                </option>

                            </select>

                        </div>

                    </div>

                </div>

            </div>


            <div class="field">

    <span class="field-title">
        PHOTO
    </span>

    <label class="upload-box">
        <span>
            Click to upload photos
        </span>

        <input
            type="file"
            id="photo"
            accept="image/*"
            multiple
        >
    </label>

    <div id="fileList" class="file-list"></div>

</div>

            <!-- CONSENT -->

            <div class="field">

                <span class="field-title">
                    CONSENT
                </span>


                <label class="consent">

                    <input
                        type="checkbox"
                        id="consent"
                    >

                    <span>
                        I confirm that I have permission to submit this photo to the St. John’s College Student Council.
                    </span>

                </label>


                <br>


                <label class="consent">

                    <input
                        type="checkbox"
                        id="schoolUse"
                    >

                    <span>
                        I understand that this photo may be used for school-related Student Council purposes.
                    </span>

                </label>

            </div>


            <!-- SUBMIT BUTTON -->

            <button
                type="button"
                id="submitButton"
            >
                Submit
            </button>


            <!-- SUCCESS MESSAGE -->

            <div
                id="successMessage"
                class="success-message"
                style="display: none;"
            >

                <h2>
                    Thank You! 🎉
                </h2>

                <p>
                    Your photo has been submitted successfully.
                </p>

            </div>


        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
